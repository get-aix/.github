name: Bug report
description: Report a reproducible bug in a get-aix project
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, OAuth tokens, or other secrets in your report."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command, configuration shape (with secrets removed), and steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "e.g. v0.1.0 or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include relevant sanitized logs or screenshots, if useful.
